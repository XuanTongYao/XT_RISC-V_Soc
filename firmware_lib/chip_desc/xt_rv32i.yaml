name: XT RISC-V
variants:
  - name: XT_RV32I
    cores:
      - name: main
        type: riscv
        core_access_options: !Riscv
    memory_map:
      - !Ram
        range:
          start: 0x0
          end: 0x2000
        cores:
          - main
        access:
          boot: true
      - !Nvm
        name: UFM
        range:
          start: 0x0
          end: 0x2ff0
        cores:
          - main
        access:
          read: false
          write: false
          execute: false
      - !Generic
        range:
          start: 0x2000
          end: 0x8000
        cores:
          - main
    flash_algorithms:
      - xt_rv32i_ufm
flash_algorithms:
  - name: xt_rv32i_ufm
    description: A flash algorithm for ufm
    default: true
    instructions: 
    load_address: 0x20
    pc_init: 0x68
    pc_uninit: 0x1c0
    pc_program_page: 0x100
    pc_erase_sector: 0x34
    pc_erase_all: 0x0
    data_section_offset: 0x268
    flash_properties:
      address_range:
        start: 0x0
        end: 0x2ff0
      page_size: 0x10
      erased_byte_value: 0x0
      program_page_timeout: 20
      erase_sector_timeout: 2000
      sectors:
        - size: 0x2ff0
          address: 0x0
    cores:
      - main
